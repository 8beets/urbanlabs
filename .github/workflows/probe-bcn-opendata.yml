# TEMPORARY (do not merge): can GitHub Actions reach Barcelona's open-data portal?
name: Probe Barcelona open data
on:
  pull_request:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx src/commands/probe-bcn-opendata.ts
