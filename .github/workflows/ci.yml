name: Checks and deployment
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run db:types
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:d1
      - run: npm run db:migrate
      # The static build reads a snapshot; CI builds from the seeded fixture database.
      - run: npm run snapshot:fixture
      - run: npm run build
        env:
          URBANLABS_SNAPSHOT: .cache/e2e-snapshot.json
      - run: npm run check:build
      # Playwright is temporarily run locally or through Docker instead of CI.

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
