name: Scheduled ingestion
on:
  schedule:
    # Once a day, off the hour to avoid GitHub's top-of-hour scheduling delays.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Approved source ID (empty = all sources)'
        required: false
permissions:
  contents: read
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The remote importer must never run twice at once (docs/ingestion.md).
    concurrency:
      group: urbanlabs-ingestion
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # A failing source fails the job (exit 1) so GitHub notifies; data from
      # failed sources is preserved by the runner.
      - name: Ingest into production D1
        run: npm run ingest:production -- --live ${SOURCE:+--source "$SOURCE"}
