services:
  app:
    build: .
    image: learnaprop-dev:local
    init: true
    ports:
      - '127.0.0.1:4321:4321'
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - local_d1:/workspace/.wrangler
      - /workspace/.astro
      - /workspace/dist
    command: sh -c 'npm run db:migrate && npm run snapshot && npm run dev -- --host 0.0.0.0'

  checks:
    build: .
    image: learnaprop-dev:local
    profiles: [checks]
    init: true
    shm_size: '1gb'
    environment:
      CI: 'true'
    volumes:
      - .:/workspace
      - dependencies:/workspace/node_modules
      - /workspace/.wrangler
      - /workspace/.astro
      - /workspace/dist
      - /workspace/test-results
      - /workspace/playwright-report
    command: npm run check

volumes:
  dependencies:
  local_d1:
